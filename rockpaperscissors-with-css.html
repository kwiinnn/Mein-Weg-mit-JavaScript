<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="styles/rockpaperscissors.css">
</head>
<body>
  <p class="title">Rock Paper Scissors</p>
  
  <button class="move-button js-rock-button" 
  ><img src="assets/rock.png"></button>

  <button class="move-button js-paper-button"
  ><img src="assets/paper.png"></button>

  <button class="move-button js-scissors-button">
  <img src="assets/scissors.png"></button>

  <p class="js-result"></p>
  <p class="js-moves"></p>
  <p class="js-score"></p>


	<button class="button js-reset-button"
  >Reset score</button>

  <button class="auto-play-button button"
  >Auto Play</button>

  <script src="scripts/rockpaperscissors.js"></script>
</body>
</html>
