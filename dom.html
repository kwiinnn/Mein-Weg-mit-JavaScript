<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM</title>
</head>
<body>
  <p>Amazon Shipping Calculator</p>
  <p>Order under $40 = +$10 shipping fee.</p>
  <p>Order above $40 = Free shipping.</p>

  <input placeholder="Cost of order" 
  class="js-cost-of-input"
  onkeydown="handleCostKeydown(event);">
  <button onclick="
    calculateTotal();
  
  ">Calculate</button>
  <p class="js-total-cost"></p>

  <script>

    function handleCostKeydown(event) {
      if (event.key === 'Enter') {
        calculateTotal();
      }
    }
    function calculateTotal() {
      const inputElement = (document.querySelector('.js-cost-of-input'));
      let cost = Number(inputElement.value);
      if (cost <= 40) {
        cost += 10;
        document.querySelector('.js-total-cost')
          .innerHTML = `$${cost}`;
      }
      else {
        document.querySelector('.js-total-cost')
          .innerHTML = `$${cost}`;
      }
    }
  </script>
</body>
</html>
